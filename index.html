<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator - Virtual Credits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">AVIATOR</div>
      <div class="subtitle">Virtual Credits Edition</div>
    </header>

    <section class="game-layout">
      <div class="flight-panel">
        <canvas id="gameCanvas"></canvas>
      </div>

      <aside class="side-panel">
        <h2>GAME</h2>

        <div class="label">BALANCE</div>
        <div id="balance" class="balance">10,000.00</div>

        <div class="label auto-label">AUTO CASH OUT</div>
        <div class="auto-row">
          <button id="autoToggle" class="toggle off">OFF</button>
          <input id="autoInput" class="auto-input" value="2.00" inputmode="decimal" aria-label="Auto cash out">
        </div>

        <div class="label bet-label">BET AMOUNT</div>
        <div class="bet-row">
          <button id="betMinus" class="small-btn">−</button>
          <input id="betInput" class="bet-input" value="500" inputmode="decimal" aria-label="Bet amount">
          <button id="betPlus" class="small-btn">+</button>
        </div>

        <button id="startBtn" class="main-btn start">PLACE BET</button>
        <button id="cashBtn" class="main-btn cash">CASH OUT</button>
        <button id="resetBtn" class="reset-btn">RESET GAME</button>

        <div id="message" class="message">Place your bet to start</div>
      </aside>
    </section>

    <section class="history-section">
      <div class="history-title">ROUND HISTORY</div>
      <div id="history" class="history"></div>
    </section>

    <footer>
      SPACE: Start &nbsp; | &nbsp; C: Cash Out &nbsp; | &nbsp;
      Click Bet Box: Type Bet &nbsp; | &nbsp; A / Shift+A: Auto ±0.50x &nbsp; | &nbsp; R: Reset
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
